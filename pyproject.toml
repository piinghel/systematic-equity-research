[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "systematic-equity-research"
version = "0.1.0"
description = "Code and portfolio-level evidence for systematic-equity research notes"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["polars>=1.44.1", "numpy>=2", "scikit-learn>=1.7"]

[dependency-groups]
dev = ["pytest>=8.4", "ruff==0.16.0", "ty==0.0.72"]

[tool.setuptools]
packages = ["portfolio_optimization"]
py-modules = ["sample_scaled_ridge"]

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP"]
